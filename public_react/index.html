            const el = bodyChildren[i];
            if (el.id === 'root' || el.tagName === 'SCRIPT' || el.tagName === 'STYLE') continue;
            
            const rect = el.getBoundingClientRect();

            if (rect.width > 0 && rect.width <= 140 && rect.height <= 140 && rect.bottom >= window.innerHeight - 180 && rect.right >= window.innerWidth - 180) {

            }
          }

          // Check inside all shadow roots
          const allEls = document.querySelectorAll('*');
          allEls.forEach(function(el) {
            if (el.shadowRoot) {

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nulltor — Dashboard</title>
  <meta name="description" content="Nulltor collaborative coding platform — manage projects, teams, and audit logs." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="dashboard.css" />
</head>

<body>

  <!-- ── Login Screen ──────────────────────────────────────────────────── -->
  <div id="login-screen" class="login-screen" hidden>
    <div class="login-bg-glow"></div>
    <div class="login-card">
      <div class="login-logo">
        <span class="logo-icon">◈</span>
        <span class="logo-text">nulltor</span>
      </div>
      <h1 class="login-title">Welcome back</h1>
      <p class="login-sub">Sign in to your workspace</p>
      <form id="login-form" class="login-form">
        <div class="form-field">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" autocomplete="email" placeholder="superadmin@nulltor.com" required />
        </div>
        <div class="form-field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" autocomplete="current-password" placeholder="••••••••" required />
        </div>
        <p id="login-error" class="form-error" hidden></p>
        <button id="login-btn" type="submit" class="btn btn-primary btn-full">Sign in</button>
      </form>
    </div>
  </div>

  <!-- ── Force Password Screen ─────────────────────────────────────────── -->
  <div id="force-password-screen" class="login-screen" hidden>
    <div class="login-bg-glow"></div>
    <div class="login-card">
      <div class="login-logo">
        <span class="logo-icon">◈</span>
        <span class="logo-text">nulltor</span>
      </div>
      <h1 class="login-title">Update Password</h1>
      <p class="login-sub">Please set a new password to continue</p>
      <form id="force-password-form" class="login-form">
        <div class="form-field">
          <label for="force-old-password">Temporary Password</label>
          <input id="force-old-password" type="password" autocomplete="current-password" required />
        </div>
        <div class="form-field">
          <label for="force-new-password">New Password</label>
          <input id="force-new-password" type="password" autocomplete="new-password" placeholder="••••••••" required />
        </div>
        <p id="force-password-error" class="form-error" hidden></p>
        <button id="force-password-btn" type="submit" class="btn btn-primary btn-full">Update Password</button>
      </form>
    </div>
  </div>

  <!-- ── Main App Shell ─────────────────────────────────────────────────── -->
  <div id="app" class="app" hidden>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <span class="logo-icon sm">◈</span>
          <span class="logo-text sm">nulltor</span>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="#projects" class="nav-item" id="nav-projects" data-view="projects">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M1.75 1A1.75 1.75 0 0 0 0 2.75v10.5C0 14.216.784 15 1.75 15h12.5A1.75 1.75 0 0 0 16 13.25v-8.5A1.75 1.75 0 0 0 14.25 3H7.5a.25.25 0 0 1-.2-.1l-.9-1.2C6.07 1.26 5.55 1 5 1H1.75Z"/></svg>
          Projects
        </a>
        <a href="#members" class="nav-item" id="nav-members" data-view="members">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 5.5a3.5 3.5 0 1 1 5.898 2.549 5.508 5.508 0 0 1 3.034 4.084.75.75 0 1 1-1.482.235 4.001 4.001 0 0 0-7.9 0 .75.75 0 0 1-1.482-.236A5.507 5.507 0 0 1 3.102 8.05 3.49 3.49 0 0 1 2 5.5ZM11 4a3.001 3.001 0 0 1 2.22 5.018 5.01 5.01 0 0 1 2.56 3.012.749.749 0 0 1-.885.954.752.752 0 0 1-.549-.514 3.507 3.507 0 0 0-2.522-2.372.75.75 0 0 1-.574-.73v-.352a.75.75 0 0 1 .416-.672A1.5 1.5 0 0 0 11 5.5.75.75 0 0 1 11 4Zm-5.5-.5a2 2 0 1 0-.001 3.999A2 2 0 0 0 5.5 3.5Z"/></svg>
          Members
        </a>
        <a href="#logs" class="nav-item" id="nav-logs" data-view="logs">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M0 1.75C0 .784.784 0 1.75 0h12.5C15.216 0 16 .784 16 1.75v9.5A1.75 1.75 0 0 1 14.25 13H8.06l-2.573 2.573A1.458 1.458 0 0 1 3 14.543V13H1.75A1.75 1.75 0 0 1 0 11.25Zm1.75-.25a.25.25 0 0 0-.25.25v9.5c0 .138.112.25.25.25h2a.75.75 0 0 1 .75.75v2.19l2.72-2.72a.749.749 0 0 1 .53-.22h6.5a.25.25 0 0 0 .25-.25v-9.5a.25.25 0 0 0-.25-.25Z"/></svg>
          Audit Logs
        </a>
        <a href="#users" class="nav-item superadmin-only" id="nav-users" data-view="users">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M10.561 8.073a6.005 6.005 0 0 1 3.432 5.142.75.75 0 1 1-1.498.07 4.5 4.5 0 0 0-8.99 0 .75.75 0 0 1-1.498-.07 6.004 6.004 0 0 1 3.431-5.142 3.999 3.999 0 1 1 5.123 0ZM10.5 5a2.5 2.5 0 1 0-5 0 2.5 2.5 0 0 0 5 0Z"/></svg>
          Users
          <span class="badge-role superadmin">SA</span>
        </a>
        <div style="flex:1"></div>
        <a href="/ide/" class="nav-item" style="color:var(--text-secondary); margin-top:16px;">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M0 2.75C0 1.784.784 1 1.75 1h12.5c.966 0 1.75.784 1.75 1.75v10.5A1.75 1.75 0 0 1 14.25 15H1.75A1.75 1.75 0 0 1 0 13.25Zm1.75-.25a.25.25 0 0 0-.25.25v10.5c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25V2.75a.25.25 0 0 0-.25-.25ZM7.25 8.5l-2.5 2.5a.75.75 0 0 1-1.06-1.06L5.69 8 3.69 6a.75.75 0 0 1 1.06-1.06l2.5 2.5a.75.75 0 0 1 0 1.06ZM11.75 11h-4a.75.75 0 0 1 0-1.5h4a.75.75 0 0 1 0 1.5Z"/></svg>
          Open IDE
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-pill" id="user-pill">
          <div class="user-avatar" id="user-avatar">—</div>
          <div class="user-info">
            <span class="user-name" id="user-name">Loading…</span>
            <span class="user-role-badge" id="user-role-badge">—</span>
          </div>
          <button class="logout-btn" id="logout-btn" title="Sign out">
            <svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 2.75C2 1.784 2.784 1 3.75 1h2.5a.75.75 0 0 1 0 1.5h-2.5a.25.25 0 0 0-.25.25v10.5c0 .138.112.25.25.25h2.5a.75.75 0 0 1 0 1.5h-2.5A1.75 1.75 0 0 1 2 13.25Zm10.44 4.5-1.97-1.97a.749.749 0 0 1 .326-1.275.749.749 0 0 1 .734.215l3.25 3.25a.75.75 0 0 1 0 1.06l-3.25 3.25a.749.749 0 0 1-1.275-.326.749.749 0 0 1 .215-.734l1.97-1.97H6.75a.75.75 0 0 1 0-1.5Z"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main-wrap">
      <!-- Top Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <h2 class="view-title" id="view-title">Projects</h2>
          <div class="breadcrumb" id="breadcrumb"></div>
        </div>
        <div class="topbar-right">
          <button class="btn btn-primary btn-sm" id="topbar-action-btn" hidden>+ New</button>
        </div>
      </header>

      <!-- View Container -->
      <main class="view-container" id="view-container">
        <!-- Dynamic content rendered here -->
      </main>
    </div>
  </div>

  <!-- ── Modals ──────────────────────────────────────────────────────────── -->

  <!-- Generic Modal -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal-card" id="modal-card">
      <div class="modal-header">
        <h3 id="modal-title">Modal</h3>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast-container" class="toast-container"></div>

  <script src="dashboard.js"></script>

</body>
</html>
